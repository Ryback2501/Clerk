{{define "layout" -}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Clerk</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <style>
    :root { --pico-font-size: 100%; }
    body > header, body > main, body > footer { padding-block: 1rem; }
    .muted { color: var(--pico-muted-color); }
    code.value { word-break: break-all; user-select: all; }
    .danger { --pico-primary: var(--pico-del-color); }
    table { font-size: .95em; }
  </style>
</head>
<body>
<header class="container">
  <nav>
    <ul><li><strong><a href="/admin">Clerk</a></strong></li></ul>
    <ul>
      <li class="muted">{{.Admin.Name}}</li>
      {{if .SignedIn}}
      <li>
        <form method="post" action="/admin/signout" style="margin:0">
          <input type="hidden" name="{{.CSRFField}}" value="{{.CSRFToken}}">
          <button type="submit" class="secondary outline">Sign out</button>
        </form>
      </li>
      {{end}}
    </ul>
  </nav>
</header>
<main class="container">
{{template "content" .}}
</main>
<footer class="container">
  <small class="muted">Clerk — an OpenID Connect provider for development and testing. Not for authenticating real users.</small>
</footer>
</body>
</html>
{{- end}}
