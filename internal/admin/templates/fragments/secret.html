{{define "secret-dialog" -}}
<dialog data-secret class="modal secret-modal" aria-labelledby="secret-title">
  <header class="modal-header">
    <p class="modal-title" id="secret-title">Client secret</p>
  </header>
  <div class="modal-body">
    <p>
      Copy it now and store it with your application's configuration. Clerk keeps only a
      hash of it: once this dialog is closed you will not be able to see or retrieve this
      secret again.
    </p>
    <button type="button" class="secret-value" data-copy aria-describedby="secret-copied">
      <code class="value secret">{{.RevealedSecret}}</code>
      <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M9 9h10v10H9zM5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
      </svg>
      <span class="sr-only">Copy the client secret</span>
    </button>
    <p class="secret-copied" id="secret-copied" data-copied hidden>Copied</p>
  </div>
  <footer class="modal-footer">
    <button type="button" class="btn btn-inverse-primary" data-close autofocus>OK</button>
  </footer>
</dialog>
{{- end}}
