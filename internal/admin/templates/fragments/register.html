{{define "register-form" -}}
<form class="modal-form" method="post" action="/admin/applications" data-register>
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <header class="modal-header">
    <h4 id="register-title" class="modal-title">Register an application</h4>
  </header>
  <div class="modal-body">
    {{if .Error}}<p class="alert alert-danger" role="alert">{{.Error}}</p>{{end}}
    <div class="form-group">
      <label for="register-name">Application name</label>
      <input id="register-name" class="form-control{{if .Error}} is-invalid{{end}}" type="text" name="name"
             value="{{.Name}}" required pattern=".*\S.*" title="The name cannot be blank."
             autocomplete="off" autofocus placeholder="My Test Application">
      <small class="form-text">
        The client ID and secret are generated for you. Add redirect URIs and test users once it exists.
      </small>
    </div>
  </div>
  <footer class="modal-footer">
    <button type="button" class="btn btn-inverse-secondary" commandfor="register" command="close">Cancel</button>
    <button type="submit" class="btn btn-inverse-primary">Create</button>
  </footer>
</form>
{{- end}}
