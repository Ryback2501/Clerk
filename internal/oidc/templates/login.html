{{define "content" -}}
<hgroup>
  <h1>Sign in to {{.ApplicationName}}</h1>
  <p class="muted">Pick a test identity. There is no password.</p>
</hgroup>

<form method="post" action="/authorize">
  <input type="hidden" name="request_id" value="{{.RequestID}}">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

  <label>
    Select user
    <select name="user_id" required autofocus>
      {{range .Users}}<option value="{{.ID}}">{{.Username}}</option>{{end}}
    </select>
  </label>

  <button type="submit">Login</button>
</form>

<p><small class="muted">
  This is a development identity provider. These identities are for testing only
  and do not represent real people.
</small></p>
{{- end}}
