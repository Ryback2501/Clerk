name: CI jobs

# Reusable CI. Called by pr-work-to-dev.yml and pr-dev-to-main.yml.
#

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go mod download
      - name: gofmt + go vet
        # `gofmt -l` exits 0 even when it lists unformatted files, so the exit code
        # cannot be trusted on its own — check the output instead.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod/go.sum; commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go mod download
      - run: go test ./... -short

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go mod download
      - run: go test ./... -run Integration

  # Drives a real browser through the admin UI and the full authorization code
  # flow against a running container.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        # Clerk built from this checkout, with administrators signed in through
        # a mock OIDC provider and authorized by a Bouncer stub.
        run: e2e/stack.sh up
      - name: Install the suite
        working-directory: e2e
        run: npm ci
      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run
        working-directory: e2e
        run: npx playwright test
      - name: Stack logs
        if: failure()
        run: e2e/stack.sh logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: e2e/stack.sh down

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go mod download
      - run: go build -o bin/clerk ./cmd/clerk
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: bin

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the image
        # Clerk refuses to start without an issuer and admin sign-in, and it
        # discovers the sign-in provider at startup, so it runs in the e2e
        # stack, whose mock provider and Bouncer stub need no network access.
        run: e2e/stack.sh up
      - name: Healthcheck
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "container is serving"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"; e2e/stack.sh logs; exit 1
      - name: Stop container
        if: always()
        run: e2e/stack.sh down

  # Secret + dependency scan, toggled by the SECURITY_SCAN repo variable so it can
  # be flipped without editing this file. Deterministic tooling — no LLM in the loop.
  security:
    name: security
    runs-on: ubuntu-latest
    if: vars.SECURITY_SCAN == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Personal accounts need no license; GitHub *orgs* require GITLEAKS_LICENSE.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Dependency vulnerability audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
