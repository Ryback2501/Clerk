# Clerk — an OpenID Connect provider for development and testing.
#
# Administration always requires signing in with an external provider, and
# Bouncer decides who may administer. Set the variables below (in the
# environment or a .env file next to this one) as described in the
# "Administration access" section of the README. Compose refuses to start
# without the Bouncer settings, and Clerk without at least one provider.
#
# To try Clerk locally without either, use e2e/compose.yml instead: it runs a
# mock sign-in provider and a Bouncer stub alongside it.

services:
  clerk:
    image: ryback2501/clerk:latest
    # Use `docker compose up --build` with this uncommented to run local changes:
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Must match what clients are configured with, exactly. It is published as
      # the issuer and stamped into every ID token.
      CLERK_ISSUER: ${CLERK_ISSUER:-http://localhost:8080}

      # The role service that authorizes administrators.
      CLERK_BOUNCER_URL: ${CLERK_BOUNCER_URL:?set CLERK_BOUNCER_URL, e.g. http://bouncer:3000}
      CLERK_BOUNCER_API_KEY: ${CLERK_BOUNCER_API_KEY:?set CLERK_BOUNCER_API_KEY to the bncr_ key Bouncer issued}
      CLERK_BOUNCER_REQUIRED_ROLE: ${CLERK_BOUNCER_REQUIRED_ROLE:-admin}

      # At least one sign-in provider; Clerk refuses to start without one. Set
      # the pair for each provider you use and leave the others empty.
      CLERK_GOOGLE_CLIENT_ID: ${CLERK_GOOGLE_CLIENT_ID:-}
      CLERK_GOOGLE_CLIENT_SECRET: ${CLERK_GOOGLE_CLIENT_SECRET:-}
      CLERK_GITHUB_CLIENT_ID: ${CLERK_GITHUB_CLIENT_ID:-}
      CLERK_GITHUB_CLIENT_SECRET: ${CLERK_GITHUB_CLIENT_SECRET:-}
      CLERK_MICROSOFT_CLIENT_ID: ${CLERK_MICROSOFT_CLIENT_ID:-}
      CLERK_MICROSOFT_CLIENT_SECRET: ${CLERK_MICROSOFT_CLIENT_SECRET:-}
      CLERK_MICROSOFT_ISSUER: ${CLERK_MICROSOFT_ISSUER:-}
      CLERK_LINKEDIN_CLIENT_ID: ${CLERK_LINKEDIN_CLIENT_ID:-}
      CLERK_LINKEDIN_CLIENT_SECRET: ${CLERK_LINKEDIN_CLIENT_SECRET:-}
    volumes:
      # Both must persist. Losing the key invalidates every token ever issued;
      # losing the database loses every registered client and test user.
      - clerk-data:/data
      - clerk-keys:/keys
    healthcheck:
      test: ["CMD", "/clerk", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  clerk-data:
  clerk-keys:
