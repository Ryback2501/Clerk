# The end-to-end stack: Clerk built from this checkout, with administration
# signed in through a mock OpenID Connect provider and authorized by a stub
# Bouncer. Nothing here reaches the internet or needs real credentials.
#
#   docker compose -f e2e/compose.yml up -d --build --wait
#   cd e2e && npx playwright test
#   docker compose -f e2e/compose.yml down -v
#
# Every service shares the host network. The upstream issuer URL has to be the
# same for the browser, which is sent to it to sign in, and for Clerk, which
# discovers it and checks it against the ID token's iss claim.

services:
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    network_mode: host
    environment:
      SERVER_PORT: "8081"
      # Non-interactive: the authorize step redirects straight back, issuing
      # a fixed identity that the stub Bouncer below recognises as an admin.
      # `$$` stops compose interpolating the mock server's own template.
      JSON_CONFIG: >-
        {
          "interactiveLogin": false,
          "tokenCallbacks": [{
            "issuerId": "google",
            "requestMappings": [{
              "requestParam": "code",
              "match": "*",
              "claims": {
                "sub": "e2e-admin",
                "name": "E2E Admin",
                "email": "e2e-admin@example.com",
                "aud": ["$${clientId}"]
              }
            }]
          }]
        }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/isalive"]
      interval: 2s
      timeout: 2s
      retries: 30

  bouncer:
    image: node:22-alpine
    network_mode: host
    command: ["node", "/stub/bouncer.mjs"]
    volumes:
      - ./stubs:/stub:ro
    environment:
      PORT: "8082"
      BOUNCER_API_KEY: bncr_e2e
      BOUNCER_ADMIN_SUB: e2e-admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  clerk:
    build: ..
    network_mode: host
    depends_on:
      # Clerk discovers the provider at startup and refuses to start without it.
      oauth:
        condition: service_healthy
      bouncer:
        condition: service_healthy
    environment:
      CLERK_ISSUER: http://localhost:8080
      CLERK_GOOGLE_CLIENT_ID: clerk-e2e
      CLERK_GOOGLE_CLIENT_SECRET: clerk-e2e-secret
      CLERK_GOOGLE_ISSUER: http://localhost:8081/google
      CLERK_BOUNCER_URL: http://localhost:8082
      CLERK_BOUNCER_API_KEY: bncr_e2e
    healthcheck:
      test: ["CMD", "/clerk", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
